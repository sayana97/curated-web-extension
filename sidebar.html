<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extension Sidebar</title>
  <link rel="stylesheet" href="sidebar.css" />
</head>

<body>
  <div class="sidebar-container">
    <div class="sidebar-content">
      <h3 class="main_heading">Your Curated Web</h3>

      <!-- Toggleable container -->
      <div class="page-actions">
        <h2 id="toggleHeader" style="cursor:pointer;">
          <span id="toggle-icon">▼</span> Modify Current Page
        </h2>

        <div id="actionsBody">
          <div class="button-grid">
            <button id="highlightBtn">Highlight Text</button>
            <button id="hideImagesBtn">Hide Images</button>
            <button id="addBannerBtn">Add Banner</button>
            <button id="increaseFontBtn">Increase Font</button>
          </div>
          <button id="fetchSelectionButton" class="fetch-button">Use Selected Text to Comment</button>
          <div id="selectedTextBox" class="selected-text-box" style="display: none;">
            <strong>Commenting on:</strong>
            <p id="selectedText"></p>
          </div>
        </div>
      </div>

      <!-- Tabs for Posts / Following / Followers -->
      <div class="tabs">
        <button class="tabBtn active" data-target="posts">Posts</button>
        <button class="tabBtn" data-target="curated" >For You</button>
        <button class="tabBtn" data-target="following">Following</button>
        <button class="tabBtn" data-target="followers">Followers</button>
      </div>

      <div id="dynamicSectionContainer">
        <div class="section active" id="section-posts">
          <div id="posts">
            <label for="postFilter">Filter posts:</label>
            <select id="postFilter">
              <option value="all" selected>All Posts</option>
              <option value="followed">Posts from People You Follow</option>
              <option value="favorites">Favorited Posts</option>
              <option value="extension">Posts via Extension</option>
            </select>

            <h4 id="f1">Posts from People You Follow</h4>
            <div id="postsFromFollowed" class="post-section"></div>

            <h4 id="f2">Your Favorited Posts</h4>
            <div id="favoritedPosts" class="post-section"></div>

            <h4 id="f3">Posts Made via Extension</h4>
            <div id="extensionPosts" class="post-section"></div>

            <h4 id="f4">Other Relevant Posts</h4>
            <div id="otherPosts" class="post-section"></div>
          </div>

        </div>

        <div class="section" id="section-following">
          <div id="followingContent"></div>
        </div>

        <div class="section" id="section-followers">
          <div id="followersContent"></div>
        </div>

        <div id="section-curated" class="section">
          <div id="curatedContent"></div>
        </div>
        


      </div>
    </div>
    <div id="errorMessage" style="color:red; display:none;"></div>
    <div id="loadingIndicator" style="display:none;">Loading...</div>
    <div id="notificationBanner" style="display:none; background:#ffc; padding:10px; cursor:pointer;"></div>
    <!-- Comment Box always visible at the bottom -->
    <div class="comment-box">
      <textarea id="postInput" placeholder="Write your post here..."></textarea>
      <button id="postButton">Publish</button>
    </div>
  </div>
  <script type="module" src="sidebar.js"></script>
  <script src="posts_tab.js"></script>
  <script src="sidebar_tabs.js"></script>
  <script src="sidebar_actions.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Sidebar</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="sidebar-container">
    <!-- Close button (optional, if you want a way to close the sidebar) -->
    <!-- <button id="closeSidebarBtn" class="close-btn">❌</button> -->

    <div class="sidebar-content">
      <h2>Mastodon Extension</h2>
      <div id="feed"></div>
    </div>

    <!-- Comment Box and Publish Button at the bottom -->
    <textarea id="postInput" placeholder="Write your post here..."></textarea>
    <button id="postButton">Publish</button>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
